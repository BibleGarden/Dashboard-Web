services:
  dashboard-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-web
    ports:
      - "9086:5173"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./.env:/app/.env
      # Exclude node_modules from mounting
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # No fallback defaults here on purpose — an unset/empty target must
      # fail vite.config.js's startup check (requireEnv), not silently proxy
      # to a hardcoded host. Set both in Dashboard-Web/.env.
      - VITE_ALIGNMENT_API_TARGET=${VITE_ALIGNMENT_API_TARGET}
      - VITE_ADMIN_API_TARGET=${VITE_ADMIN_API_TARGET}
    stdin_open: true
    tty: true
    networks:
      - dashboard-network
      # Shared with dashboard-api (see Dashboard-API/docker-compose.yml), so
      # the dev container can reach it as http://dashboard-api:8000/api
      # instead of a host-machine hostname that may not resolve correctly
      # from inside the container (e.g. IPv6 link-local addresses).
      - mysql_default

networks:
  dashboard-network:
    driver: bridge
  mysql_default:
    external: true
